<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopStream – Live Analytics Dashboard</title>
  <style>
    /* ... Keep your existing CSS ... */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }
    header { background: #161b22; border-bottom: 1px solid #30363d; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1.2rem; color: #58a6ff; }
    
    /* NEW: Spike Alert Styles */
    #spike-alert {
      display: none;
      background: #f85149;
      color: white;
      text-align: center;
      padding: 10px;
      font-weight: bold;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    /* KPI and Panel styles from your original code */
    .kpi-row { display: flex; flex-wrap: wrap; gap: 16px; padding: 24px; }
    .kpi { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 18px 24px; flex: 1; min-width: 160px; }
    .kpi .label { font-size: 0.75rem; color: #8b949e; text-transform: uppercase; }
    .kpi .value { font-size: 2rem; font-weight: 700; margin-top: 6px; color: #58a6ff; }
    .panels { display: flex; flex-wrap: wrap; gap: 16px; padding: 0 24px 24px; }
    .panel { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; flex: 1; min-width: 280px; }
    .panel h3 { font-size: 0.85rem; color: #8b949e; text-transform: uppercase; margin-bottom: 16px; }

    /* Device Bar Styles */
    .device-bar { height: 10px; background: #21262d; border-radius: 5px; margin-top: 8px; overflow: hidden; }
    .device-fill { height: 100%; background: #58a6ff; transition: width 0.5s; }
    
    /* ... Rest of your existing feed/bar styles ... */
    #feed { font-family: "Courier New", monospace; font-size: 0.78rem; max-height: 320px; overflow-y: auto; }
    .feed-row { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid #21262d; }
  </style>
</head>
<body>

<div id="spike-alert">🚨 TRAFFIC SPIKE DETECTED (System.Timestamp Window)</div>

<header>
  <h1>ShopStream – Live Analytics</h1>
  <div style="display:flex; align-items:center; gap:16px;">
    <div class="live-badge" id="conn-status"><div class="dot"></div> LIVE</div>
    <nav><a href="/">← Back to Store</a></nav>
  </div>
</header>

<div class="kpi-row">
  <div class="kpi"><div class="label">Total Events</div><div class="value" id="kpi-total">0</div></div>
  <div class="kpi"><div class="label">Desktop</div><div class="value" id="kpi-desktop">0</div></div>
  <div class="kpi"><div class="label">Mobile</div><div class="value" id="kpi-mobile">0</div></div>
</div>

<div class="panels">
  <div class="panel" style="max-width:350px;">
    <h3>Device Breakdown</h3>
    <div id="device-list">
        <p>Desktop: <span id="dev-desktop-count">0</span></p>
        <div class="device-bar"><div id="bar-desktop" class="device-fill" style="width: 0%"></div></div>
        <br>
        <p>Mobile: <span id="dev-mobile-count">0</span></p>
        <div class="device-bar"><div id="bar-mobile" class="device-fill" style="width: 0%; background: #3fb950;"></div></div>
    </div>
  </div>

  <div class="panel">
    <h3>Live Event Feed</h3>
    <div id="feed">Waiting for events...</div>
  </div>
</div>

<script>
  function fetchAndRender() {
    fetch("/api/events?limit=50")
      .then(res => res.json())
      .then(data => {
        // 1. Update KPIs
        document.getElementById("kpi-total").textContent = data.total ?? 0;
        
        // 2. Update Device Breakdown (Insight 1)
        const devices = data.device_summary || { desktop: 0, mobile: 0 };
        document.getElementById("kpi-desktop").textContent = devices.desktop;
        document.getElementById("kpi-mobile").textContent = devices.mobile;
        document.getElementById("dev-desktop-count").textContent = devices.desktop;
        document.getElementById("dev-mobile-count").textContent = devices.mobile;
        
        // Calculate Percentages for Bars
        const total = (devices.desktop + devices.mobile) || 1;
        document.getElementById("bar-desktop").style.width = (devices.desktop / total * 100) + "%";
        document.getElementById("bar-mobile").style.width = (devices.mobile / total * 100) + "%";

        // 3. Spike Detection (Insight 2)
        const alertBox = document.getElementById("spike-alert");
        if (data.is_spike) {
            alertBox.style.display = "block";
        } else {
            alertBox.style.display = "none";
        }

        // 4. Render Feed (Your original logic)
        renderFeed(data.events);
      })
      .catch(err => console.error("Poll error:", err));
  }

  function renderFeed(events) {
    const feed = document.getElementById("feed");
    if (!events || events.length === 0) return;
    feed.innerHTML = "";
    [...events].reverse().forEach(e => {
      const ts = e.timestamp ? e.timestamp.slice(11, 19) : "–";
      const row = document.createElement("div");
      row.className = "feed-row";
      row.innerHTML = `<span style="color:#8b949e">${ts}</span> | <strong>${e.event_type}</strong> | ${e.deviceType || 'desktop'}`;
      feed.appendChild(row);
    });
  }

  setInterval(fetchAndRender, 2000);
  fetchAndRender();
</script>
</body>
</html>
